name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set +e
          go test ./... -count=1 > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          if [ $status -ne 0 ]; then
            # Surface the failure as an annotation: the raw logs are not
            # always reachable from restricted networks.
            msg=$(grep -v '^ok ' /tmp/test.log | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test::$msg"
          fi
          exit $status

      - name: Build for every Raspberry Pi target
        run: make release

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"; echo "$unformatted"
            gofmt -d . | head -c 3000
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: adblockerpro-binaries
          path: dist/
          retention-days: 14
