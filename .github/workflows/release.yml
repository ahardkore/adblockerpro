name: Release

# Builds the release binaries (Makefile release target, producing dist/ plus
# SHA256SUMS) and attaches them to a GitHub release when you push a tag.
# This is what deploy/install.sh downloads, and what the checksums are checked
# against.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify before publishing
        run: |
          go vet ./...
          go test ./... -count=1 -race

      - name: Build release binaries
        run: make release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists — uploading assets"
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }}" \
              --notes "adblockerpro ${{ github.ref_name }}"
          fi
